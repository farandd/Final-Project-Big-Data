<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Product Prediction</title>
    <style>
      /* Global Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #333;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      /* Header */
      header {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        margin-bottom: 30px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      header h1 {
        font-size: 3rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
        font-weight: 700;
      }

      header p {
        color: #666;
        font-size: 1.2rem;
        font-weight: 500;
      }

      /* Section Styles */
      section {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin-bottom: 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      section:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
      }

      section h2 {
        color: #333;
        font-size: 2rem;
        margin-bottom: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      section h2::before {
        content: "";
        font-size: 1.5rem;
      }

      .prediction-section h2::before {
        content: "";
      }

      /* Form Styles */
      .filter-container {
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      .filter-container label {
        font-weight: 600;
        color: #555;
        font-size: 1.1rem;
      }

      select,
      input,
      button {
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 12px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: white;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
      }

      select {
        cursor: pointer;
        min-width: 200px;
      }

      /* Table Styles */
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-bottom: 25px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      th {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        padding: 18px;
        text-align: left;
        font-weight: 600;
        font-size: 1.1rem;
      }

      td {
        padding: 18px;
        background: white;
        border-bottom: 1px solid #f0f0f0;
      }

      td input,
      td select {
        width: 100%;
        margin: 0;
        border: 1px solid #ddd;
      }

      /* Button Styles */
      button {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        background: linear-gradient(135deg, #5a6fd8, #6a4c93);
      }

      button:active {
        transform: translateY(-1px);
      }

      /* List Styles */
      ul.product-list {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 15px;
      }

      ul.product-list li {
        padding: 20px;
        background: linear-gradient(135deg, #f8f9ff, #f0f2ff);
        border: 1px solid #e1e5e9;
        border-radius: 12px;
        transition: all 0.3s ease;
        font-weight: 500;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      ul.product-list li:hover {
        transform: translateX(10px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border-color: #667eea;
      }

      /* Result Styles */
      #result {
        padding: 25px;
        background: linear-gradient(135deg, #d4edda, #c3e6cb);
        border: 2px solid #b8dacc;
        color: #155724;
        border-radius: 15px;
        margin-top: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        animation: slideIn 0.5s ease;
      }

      #result h3 {
        margin-bottom: 15px;
        color: #0f5132;
        font-size: 1.5rem;
      }

      #result p {
        margin-bottom: 10px;
        font-size: 1.1rem;
      }

      .error {
        color: #dc3545;
        font-weight: bold;
        background: linear-gradient(135deg, #f8d7da, #f5c6cb);
        padding: 15px;
        border-radius: 10px;
        border: 2px solid #f1aeb5;
      }

      /* Animations */
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        header h1 {
          font-size: 2rem;
        }

        section {
          padding: 20px;
        }

        table,
        th,
        td {
          font-size: 0.9rem;
        }

        .filter-container {
          flex-direction: column;
          align-items: stretch;
        }

        select {
          min-width: auto;
          width: 100%;
        }
      }

      /* Loading Animation */
      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Event Product Prediction</h1>
        <p>AI-Powered Sales Analytics & Forecasting Platform</p>
      </header>

      <!-- Top-Selling Products Section -->
      <section>
        <h2>Top-Selling Products</h2>
        <div class="filter-container">
          <label for="category-filter">Filter by Category:</label>
          <select id="category-filter">
            <option value="">All Categories</option>
            <option value="elektronik">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="olahraga">Sports</option>
            <option value="handphone">Mobile Phones</option>
            <option value="pertukangan">Home Appliances</option>
          </select>
        </div>
        <ul id="top-products-list" class="product-list">
          <li><span class="loading"></span> Loading products...</li>
        </ul>
      </section>

      <!-- Product Prediction Form -->
      <section class="prediction-section">
        <h2>AI Product Prediction</h2>
        <form id="data-form">
          <table>
            <tr>
              <th>Product Category</th>
              <th>Past Sales Volume</th>
            </tr>
            <tr>
              <td>
                <select name="category" required>
                  <option value="1">Electronics</option>
                  <option value="2">Fashion</option>
                  <option value="3">Sports</option>
                  <option value="4">Mobile Phones</option>
                  <option value="5">Home Appliances</option>
                </select>
              </td>
              <td>
                <input
                  type="number"
                  step="1"
                  name="sales"
                  placeholder="Enter sold count"
                  required
                  min="0"
                />
              </td>
            </tr>
          </table>
          <button type="submit">Generate Prediction</button>
        </form>
        <div id="result"></div>
      </section>
    </div>

    <script>
      // Fetch Top Products
      async function fetchTopProducts(category = "") {
        try {
          // Show loading state
          const topProductsList = document.getElementById("top-products-list");
          topProductsList.innerHTML =
            '<li><span class="loading"></span> Loading products...</li>';

          const response = await fetch(
            `http://localhost:5000/top-sold-products${
              category ? "?category=" + category : ""
            }`
          );
          if (!response.ok) {
            throw new Error(
              `Failed to fetch top products: ${response.statusText}`
            );
          }
          const data = await response.json();

          topProductsList.innerHTML = ""; // Clear previous data

          if (data.top_products && data.top_products.length > 0) {
            data.top_products.forEach((product, index) => {
              const listItem = document.createElement("li");
              listItem.innerHTML = `
                        <span><strong>#${index + 1}</strong> ${
                product.product_name
              }</span>
                        <span style="color: #28a745; font-weight: bold;">Sold: ${product.sold.toLocaleString()}</span>
                    `;
              topProductsList.appendChild(listItem);
            });
          } else {
            topProductsList.innerHTML =
              "<li>No products found for this category</li>";
          }
        } catch (error) {
          console.error("Error fetching top products:", error);
          document.getElementById("top-products-list").innerHTML =
            "<li class='error'>❌ Unable to fetch data. Please try again later.</li>";
        }
      }

      // Handle Category Filter Change
      document
        .getElementById("category-filter")
        .addEventListener("change", (event) => {
          fetchTopProducts(event.target.value);
        });

      // Initial fetch
      fetchTopProducts();

      // Handle Prediction Form Submission
      document
        .getElementById("data-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const submitButton = e.target.querySelector('button[type="submit"]');
          const originalText = submitButton.innerHTML;
          submitButton.innerHTML =
            '<span class="loading"></span> Processing...';
          submitButton.disabled = true;

          const formData = new FormData(e.target);
          const data = {};
          formData.forEach((value, key) => (data[key] = value));

          const features = [
            parseInt(data.category), // Category as integer
            parseFloat(data.sales), // Sales as float
          ];

          try {
            const response = await fetch("http://localhost:5000/predict", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ features }),
            });

            if (!response.ok) {
              const error = await response.json();
              throw new Error(error.error || "Server Error");
            }

            const result = await response.json();
            document.getElementById("result").innerHTML = `
                <h3> Prediction Results</h3>
                <p><strong>Predicted Product Category:</strong> ${
                  result.product
                }</p>
                <p><strong>Expected Sales Volume:</strong> ${Math.round(
                  result.sales
                ).toLocaleString()} units</p>
                <p style="margin-top: 15px; font-size: 0.9rem; color: #666;">
                    <em>Prediction generated using machine learning algorithms</em>
                </p>
            `;
          } catch (error) {
            document.getElementById(
              "result"
            ).innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
          } finally {
            submitButton.innerHTML = originalText;
            submitButton.disabled = false;
          }
        });
    </script>
  </body>
</html>
